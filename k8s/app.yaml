apiVersion: v1
kind: Namespace
metadata:
  name: blackwheel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackwheel-web
  namespace: blackwheel
  labels:
    app: blackwheel-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackwheel-web
  template:
    metadata:
      labels:
        app: blackwheel-web
    spec:
      containers:
        - name: web
          image: blackwheel-web:stable # override per env: kubectl set image deploy/blackwheel-web web=registry/blackwheel-web:1.0.0 -n blackwheel
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: blackwheel-web
  namespace: blackwheel
spec:
  type: ClusterIP
  selector:
    app: blackwheel-web
  ports:
    - port: 80
      targetPort: 80
